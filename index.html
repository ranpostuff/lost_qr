const L=(g,arr)=>arr.map(x=>g+"-"+x);
const GRADES=[["Grade 7",L(7,"ABCDEF".split(""))],["Grade 8",L(8,"ABCDEF".split(""))],["Grade 9",L(9,"ABCDE".split(""))],["Grade 10",L(10,"ABCDE".split(""))],["Grade 11",L(11,["Amaranth","Burgundy","Cerulean","Driftwood","Ebony","Fuchsia","Garnet","Honeydew"])],["Grade 12",L(12,["Amethyst","Bloodstone","Emerald","Epidote","Euclase","Fedorite","Obsidian","Sapphire"])]];
const ALLSEC=GRADES.flatMap(g=>g[1]);
const secKey=s=>String(s||"").toLowerCase().replace(/\s+/g,"");
const canon=s=>{const k=secKey(s);return ALLSEC.find(x=>secKey(x)===k)||ALLSEC.find(x=>secKey(x)===k.replace(/^(\d+)(?!-)/,"$1-"))||clean(s);};
const clean=v=>String(v||"").replace(/\s+/g," ").trim();
const when=ts=>{try{return new Date(ts).toLocaleDateString([],{month:"short",day:"numeric"});}catch(e){return "";}};
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const ord=n=>n===2?"2nd":n===3?"3rd":n+"th";
const initials=n=>{const t=clean(n).split(" ").filter(Boolean);return(((t[0]||"")[0]||"")+(t.length>1?t[t.length-1][0]:"")).toUpperCase()||"?";};
const SV=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';

function el(tag,cls,text,html){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;if(html)e.innerHTML=html;return e;}
function btn(label,cls,fn){const b=el("button","btn "+(cls||""),label);b.type="button";b.onclick=fn;return b;}

/* state */
let sheetFull=false,sheets=[],sheetDraft=null,sheetN=null,sheetDirty=false,saveT=null,all=[],batches=[],bsel="latest",loaded=false,user=null,tab="todo",q="",sent=false,flashId=null;

/* toast */
function say(t,kind){const box=document.getElementById("toastBox");box.textContent="";if(!t)return;const d=el("div","toast"+(kind==="bad"?" toast--bad":""),t);
 if(kind==="bad"){const x=ibtn(IC.x,"Dismiss",()=>box.textContent="");x.classList.add("toast__x");d.appendChild(x);}
 box.appendChild(d);clearTimeout(toastT);if(kind!=="bad")toastT=setTimeout(()=>box.textContent="",3000);}

/* ---------- same-student detection (unchanged logic) ---------- */
function toks(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean);}
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function tokEq(a,b){if(a===b)return true;if(a.length===1&&b[0]===a)return true;if(b.length===1&&a[0]===b)return true;return a.length>=4&&b.length>=4&&lev(a,b)<=1;}
function covers(big,small){const used=new Set();return small.every(t=>{const i=big.findIndex((b,k)=>!used.has(k)&&tokEq(t,b));if(i<0)return false;used.add(i);return true;});}
function sameStudent(e,r){const a=e._t,b=r._t;if(!a.length||!b.length)return false;if(a.length===b.length)return covers(b,a)&&covers(a,b);
 const small=a.length<b.length?a:b,big=a.length<b.length?b:a;return small.length>=2&&canon(e.section)===canon(r.section)&&covers(big,small);}
function cluster(){all.forEach(e=>{e._t=toks(e.name);});const order=all.slice().sort((x,y)=>y._t.length-x._t.length||(x.ts||0)-(y.ts||0));const groups=[];
 order.forEach(e=>{let g=groups.find(g=>sameStudent(e,g.rep));if(!g){g={rep:e,name:e.name||"",items:[]};groups.push(g);}g.items.push(e);e._g=g;});
 groups.forEach(g=>{g.items.sort((a,b)=>(a.ts||0)-(b.ts||0));g.items.forEach((e,i)=>{e._n=i+1;});});return groups;}

/* ---------- batches (unchanged logic) ---------- */
const curN=()=>batches.length?batches[batches.length-1].n:1;
const selN=()=>bsel==="latest"?curN():bsel;
const batchOf=e=>{if(Number.isFinite(e.batch))return e.batch;let n=1;const t=e.ts||0;for(const b of batches){if(t>=b.ts)n=b.n;else break;}return n;};
const inB=e=>{const s=selN();return s==="all"||e._b===s;};
const batchNums=()=>[1].concat(batches.map(b=>b.n)).filter((n,i,a)=>a.indexOf(n)===i).sort((a,b)=>b-a);
const bLabel=()=>selN()==="all"?"All batches":"Batch "+selN()+(selN()===curN()?" · current":"");
const vis=e=>!q||[e.name,canon(e.section),e.reason,e._g&&e._g.name].join(" ").toLowerCase().includes(q);

/* ---------- sheet (dialog) with focus trap, Esc, backdrop close, focus return, scroll lock ---------- */
let closeSheet=()=>{};
function sheet(title,build){
  closeSheet();const prev=document.activeElement,layer=document.getElementById("layer");
  const bd=el("div","backdrop"),sh=el("div","sheet");sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-labelledby","shT");
  sh.appendChild(el("div","sheet__grab"));const h=el("h2",null,title);h.id="shT";h.tabIndex=-1;sh.appendChild(h);
  const close=()=>{document.removeEventListener("keydown",key);layer.textContent="";document.body.classList.remove("lock");closeSheet=()=>{};if(prev&&prev.isConnected)prev.focus();};
  const key=ev=>{if(ev.key==="Escape"){ev.preventDefault();close();return;}
   if(ev.key==="Tab"){const f=[...sh.querySelectorAll("button,input,select,[tabindex='0']")].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(ev.shiftKey&&(document.activeElement===a||document.activeElement===h)){ev.preventDefault();z.focus();}else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus();}}};
  bd.onclick=close;document.addEventListener("keydown",key);build(sh,close);layer.append(bd,sh);document.body.classList.add("lock");closeSheet=close;h.focus();return close;}
function menu(title,items){sheet(title,(sh,close)=>{items.forEach(it=>{if(!it)return;const b=el("button","item"+(it.danger?" item--danger":"")+(it.sep?" item--sep":""),it.label);b.type="button";b.onclick=()=>{close();it.fn();};sh.appendChild(b);});});}
function confirmSheet(title,text,okLabel,danger,fn){sheet(title,(sh,close)=>{sh.appendChild(el("p","muted",text));const a=el("div","sheet__actions");
  a.appendChild(btn(okLabel,danger?"btn--danger":"",()=>{close();fn();}));a.appendChild(btn("Cancel","btn--text",close));sh.appendChild(a);});}

/* ---------- actions ---------- */
const flash=id=>{flashId=id;setTimeout(()=>{flashId=null;},900);};
const toggleExempt=e=>{flash(e._id);updateDoc(doc(db,COL,e._id),{exempt:!e.exempt}).then(()=>say(e.exempt?"Marked as paying.":"Marked exempt.")).catch(()=>say("Couldn’t save. Try again.","bad"));};
const toggleDone=(e,cb)=>{cb.disabled=true;flash(e._id);updateDoc(doc(db,COL,e._id),{done:cb.checked}).catch(()=>say("Couldn’t save. Try again.","bad"));};
function moveSheet(e){sheet("Move to batch",(sh,close)=>{const cur=Number.isFinite(e.batch)?e.batch:"auto";
  const row=(label,sub,val,on)=>{const b=el("button","item",null);b.type="button";b.setAttribute("role","menuitemradio");b.setAttribute("aria-checked",String(on));
   const t=el("span","item__txt");t.appendChild(document.createTextNode(label));if(sub)t.appendChild(el("span","item__sub",sub));b.appendChild(t);if(on)b.appendChild(el("span","tick",null,IC.check));
   b.onclick=()=>{close();flash(e._id);updateDoc(doc(db,COL,e._id),{batch:val}).then(()=>say(val===null?"Batch set to automatic.":"Moved to Batch "+val+".")).catch(()=>say("Couldn’t move it. Try again.","bad"));};sh.appendChild(b);};
  batchNums().forEach(n=>row("Batch "+n,n===curN()?"Current":"",n,cur===n));row("Automatic","By the date it was sent",null,cur==="auto");});}
function editSheet(e){sheet("Edit request",(sh,close)=>{
  const f=(lab,input)=>{const l=el("label","field",lab);l.appendChild(input);sh.appendChild(l);};
  const n=el("input");n.type="text";n.maxLength=100;n.value=e.name||"";
  const s=el("select");ALLSEC.forEach(x=>{const o=el("option",null,x);o.value=x;s.appendChild(o);});const c=canon(e.section);if(!ALLSEC.includes(c)){const o=el("option",null,c);o.value=c;s.appendChild(o);}s.value=c;
  const r=el("input");r.type="text";r.maxLength=100;r.value=e.reason||"";
  f("Name of student",n);f("Section",s);f("Why was it lost?",r);
  const a=el("div","sheet__actions"),sv2=btn("Save","",()=>{const name=clean(n.value),reason=clean(r.value);if(!name||!reason)return say("Name and reason can’t be empty.","bad");
   sv2.disabled=true;flash(e._id);updateDoc(doc(db,COL,e._id),{name,section:s.value,reason}).then(()=>{close();say("Saved.");}).catch(()=>{sv2.disabled=false;say("Couldn’t save. Try again.","bad");});});
  a.appendChild(sv2);a.appendChild(btn("Cancel","btn--text",close));sh.appendChild(a);});}
function reqMenu(e){menu(e.name||"Request",[{label:"Edit",fn:()=>editSheet(e)},{label:e.exempt?"Undo exempt":"Exempt from ₱"+PRICE,fn:()=>toggleExempt(e)},{label:"Move to batch…",fn:()=>moveSheet(e)},
  {label:"Delete",danger:true,sep:true,fn:()=>confirmSheet("Delete this request?","Request for "+e.name+" will be removed, including from the student’s history.","Delete",true,()=>deleteDoc(doc(db,COL,e._id)).then(()=>say("Deleted.")).catch(()=>say("Couldn’t delete. Try again.","bad")))}]);}
function newBatch(){const n=curN()+1;confirmSheet("Start Batch "+n+"?","Every request sent from now on goes into Batch "+n+". Earlier requests stay in their own batches.","Start Batch "+n,false,()=>
  addDoc(collection(db,"batches"),{n,ts:Date.now()}).then(()=>{bsel="latest";sv={lvl:"grades"};say("Batch "+n+" started.");}).catch(()=>say("Couldn’t start a new batch.","bad")));}
function undoBatch(){const b=batches[batches.length-1];if(!b)return;const prev=batches.length>1?batches[batches.length-2].n:1;
  confirmSheet("Undo Batch "+b.n+"?","Its requests move back into Batch "+prev+".","Undo Batch "+b.n,true,()=>deleteDoc(doc(db,"batches",b._id)).then(()=>{if(bsel===b.n)bsel="latest";say("Batch undone.");}).catch(()=>say("Couldn’t undo. Try again.","bad")));}
function batchSheet(){sheet("Choose batch",(sh,close)=>{
  sh.appendChild(el("p","muted","A batch is a group of requests. Start a new one when you begin a new round of QR making."));
  const row=(label,sub,val,on)=>{const b=el("button","item");b.type="button";b.setAttribute("role","menuitemradio");b.setAttribute("aria-checked",String(on));
   const t=el("span","item__txt");t.appendChild(document.createTextNode(label));t.appendChild(el("span","item__sub",sub));b.appendChild(t);if(on)b.appendChild(el("span","tick",null,IC.check));
   b.onclick=()=>{bsel=val;sv={lvl:"grades"};close();render();};sh.appendChild(b);};
  const stat=n=>{const es=all.filter(e=>e._b===n);return es.length+" lost · "+es.filter(e=>!e.done).length+" waiting";};
  row("All batches",plural(all.length,"request"),"all",selN()==="all");
  batchNums().forEach(n=>row("Batch "+n+(n===curN()?" · current":""),stat(n),n===curN()?"latest":n,selN()===n));
  const a=el("div","sheet__actions");a.appendChild(btn("Start a new batch","",()=>{close();newBatch();}));
  if(batches.length)a.appendChild(btn("Undo latest batch","btn--text",()=>{close();undoBatch();}));sh.appendChild(a);});}
function copyWaiting(){cluster();const seen=new Set();const list=all.filter(inB).filter(e=>{if(e.done||seen.has(e._g))return false;seen.add(e._g);return true;});
  if(!list.length)return say("Nothing waiting.","bad");
  const text=["Name of student\tSection\tReason"].concat(list.map(e=>[e._g.name,canon(e.section),e.reason||""].join("\t"))).join("\n");
  const ok=()=>say("Copied "+list.length+".");const fb=()=>{const t=el("textarea");t.value=text;document.body.appendChild(t);t.select();let r=false;try{r=document.execCommand("copy");}catch(x){}document.body.removeChild(t);r?ok():say("Copy failed. Try again.","bad");};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fb);else fb();}
/* copy every student in the viewed batch (done or not) as a numbered list, grouped by grade level */
function copyList(){cluster();all.forEach(e=>{e._b=batchOf(e);});const P=all.filter(inB);
  if(!P.length)return say("Nothing in this batch.","bad");
  const by=new Map();const seen=new Set();
  P.forEach(e=>{if(seen.has(e._g))return;seen.add(e._g);const s=canon(e.section),g=gradeOf(s);if(!by.has(g))by.set(g,[]);by.get(g).push({name:e._g.name,s});});
  const out=[];let total=0;
  GRADES.map(g=>g[0]).concat("Other").filter(g=>by.has(g)).forEach(g=>{
    const list=by.get(g).sort((a,b)=>(ALLSEC.indexOf(a.s)-ALLSEC.indexOf(b.s))||a.name.localeCompare(b.name));
    if(out.length)out.push("");out.push(g.toUpperCase()+" ("+list.length+")");
    list.forEach((x,i)=>out.push((i+1)+". "+x.name+" - "+x.s));total+=list.length;});
  const text=(selN()==="all"?"ALL BATCHES":"BATCH "+selN())+" - "+total+" students\n\n"+out.join("\n");
  const ok=()=>say("Copied "+total+" students.");
  const fb=()=>{const t=el("textarea");t.value=text;document.body.appendChild(t);t.select();let r=false;try{r=document.execCommand("copy");}catch(x){}document.body.removeChild(t);r?ok():say("Copy failed. Try again.","bad");};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fb);else fb();}
const moreMenu=()=>menu("Menu",[{label:"Copy student list (this batch)",fn:copyList},{label:"Copy waiting list",fn:copyWaiting},{label:"Start a new batch",fn:newBatch},batches.length?{label:"Undo latest batch",fn:undoBatch}:null,{label:"Sign out",sep:true,fn:()=>signOut(auth)}]);

/* ---------- admin render ---------- */
function empty(text){const d=el("div","empty",null,IC.box);d.appendChild(el("p",null,text));return d;}
const emptyMsg=()=>!all.length?"No requests yet.":(!all.filter(inB).length?"Nothing in this batch yet.":(q?"No matches for “"+q+"”.":"Nothing waiting. Nice work."));
function requestCard(e){const card=el("div","card"+(e.done?" card--done":"")+(e.exempt?" card--exempt":"")+(e._id===flashId?" card--flash":""));
  const lab=el("label","check");const cb=el("input");cb.type="checkbox";cb.checked=!!e.done;cb.setAttribute("aria-label","QR made: "+e.name);cb.onchange=()=>toggleDone(e,cb);lab.appendChild(cb);
  const b=el("div","card__body");b.appendChild(el("div","card__title wrap",e.name||""));
  b.appendChild(el("div","card__meta wrap",[canon(e.section),e.reason,when(e.ts),selN()==="all"?"Batch "+e._b:"",e.exempt?"Exempt":""].filter(Boolean).join(" · ")));
  const c=e._g.items.length;
  if(e.done)b.appendChild(pill("QR made","outline"));else if(c>1)b.appendChild(pill("Repeat · "+ord(e._n)+" of "+c,"repeat"));
  card.append(lab,b,ibtn(IC.dots,"Actions for "+e.name,()=>reqMenu(e)));return card;}
function hero(P){const lost=P.length,ex=P.filter(e=>e.exempt).length,h=el("section","hero");h.setAttribute("aria-label","Summary");
  h.appendChild(el("div","hero__label","Revenue · "+bLabel()));h.appendChild(el("div","hero__num","₱"+((lost-ex)*PRICE).toLocaleString()));
  const s=el("div","hero__sub");const a=el("span",null,"Lost QR ");a.appendChild(el("b",null,lost));const b=el("span",null,"Exempt ");b.appendChild(el("b",null,ex));s.append(a,b,el("span",null,"₱"+PRICE+" each"));h.appendChild(s);return h;}
function searchBox(){const w=el("div","search");w.appendChild(el("span","ico",null,IC.search));const i=el("input");i.type="text";i.id="q";i.autocomplete="off";i.placeholder="Search name, section or reason";i.setAttribute("aria-label","Search");i.value=q;
  i.oninput=()=>{q=clean(i.value).toLowerCase();const p=i.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(p,p);};w.appendChild(i);
  if(q)w.appendChild(ibtn(IC.x,"Clear search",()=>{q="";render();}));return w;}
function renderTodo(box,P){
  const pending=P.filter(e=>!e.done),done=P.filter(e=>e.done).reverse();
  const shown=pending.concat(done).filter(vis);
  const other=all.filter(e=>!e.done&&selN()!=="all"&&e._b!==selN());
  if(other.length){const byB={};other.forEach(e=>{byB[e._b]=(byB[e._b]||0)+1;});const k=Object.keys(byB).sort((a,b)=>b-a)[0];
   const h=el("div","hint",plural(other.length,"request")+" still waiting in "+(Object.keys(byB).length>1?"older batches":"Batch "+k)+".");
   const v=el("button",null,"View all");v.type="button";v.onclick=()=>{bsel="all";render();};h.appendChild(v);box.appendChild(h);}
  const sh=el("div","sec-head");sh.appendChild(el("h2",null,"To do · "+pending.length+" waiting"));sh.appendChild(btn("Copy list","btn--secondary",copyList));box.appendChild(sh);
  const list=el("div","stack");shown.forEach(e=>list.appendChild(requestCard(e)));box.appendChild(list);
  if(!shown.length)box.appendChild(empty(emptyMsg()));}
const gradeOf=s=>{const g=GRADES.find(x=>x[1].includes(s));return g?g[0]:"Other";};
function studentRow(g,es,showSec){const mine=es.filter(e=>e._g===g);const r=el("button","row"+(mine.length&&mine.every(e=>e.exempt)?" row--exempt":""));r.type="button";
  r.appendChild(el("span","ico avatar",initials(g.name)));const b=el("span","row__body");b.appendChild(el("div","card__title wrap",g.name));
  b.appendChild(el("div","card__meta",(showSec?canon(mine[0].section)+" · ":"")+(mine.filter(e=>!e.done).length?mine.filter(e=>!e.done).length+" waiting":"All QR made")));r.appendChild(b);
  r.appendChild(pill(plural(mine.length,"loss").replace("losss","losses"),mine.length>1?"repeat":""));r.insertAdjacentHTML("beforeend",IC.chev);r.onclick=()=>{sv={...sv,lvl:"student",st:g.items[0]._id};render();window.scrollTo(0,0);};return r;}
function crumbs(parts){const n=el("nav","crumbs");n.setAttribute("aria-label","Breadcrumb");
  if(parts.length>1){const back=parts[parts.length-2];n.appendChild(ibtn(IC.back,"Back to "+back.t,back.fn));}
  parts.forEach((p,i)=>{if(i)n.appendChild(el("span","sep","›"));if(i===parts.length-1){const c=el("span",null,p.t);c.setAttribute("aria-current","location");c.className="wrap";n.appendChild(c);}else{const b=el("button",null,p.t);b.type="button";b.onclick=p.fn;n.appendChild(b);}});return n;}
const goSv=o=>()=>{sv=o;render();window.scrollTo(0,0);};
function renderStudents(box,P,groups){
  const wrap=el("div","view");
  if(q){const gs=[...new Set(P.filter(vis).map(e=>e._g))];
   wrap.appendChild(el("div","sec-head")).append(el("h2",null,plural(gs.length,"student")));
   gs.sort((a,b)=>a.name.localeCompare(b.name)).forEach(g=>wrap.appendChild(studentRow(g,P.filter(e=>e._g===g),true)));if(!gs.length)wrap.appendChild(empty(emptyMsg()));box.appendChild(wrap);return;}
  const byGrade=new Map();P.forEach(e=>{const s=canon(e.section),g=gradeOf(s);if(!byGrade.has(g))byGrade.set(g,new Map());const m=byGrade.get(g);if(!m.has(s))m.set(s,[]);m.get(s).push(e);});
  const stuN=es=>new Set(es.map(e=>e._g)).size;
  if(sv.lvl==="student"){const st=all.find(e=>e._id===sv.st);if(!st)sv={lvl:"grades"};}
  if(sv.lvl==="sections"&&!byGrade.get(sv.g))sv={lvl:"grades"};
  if(sv.lvl==="roster"&&!(byGrade.get(sv.g)&&byGrade.get(sv.g).has(sv.s)))sv={lvl:"grades"};
  if(sv.lvl==="grades"){wrap.appendChild(crumbs([{t:"Students"}]));const grid=el("div","folders");
   GRADES.map(g=>g[0]).filter(g=>byGrade.has(g)).forEach(g=>{const m=byGrade.get(g),es=[].concat(...m.values());const t=el("button","tile");t.type="button";
    t.appendChild(el("span","ico",null,IC.grade));t.appendChild(el("div","card__title",g));t.appendChild(el("div","card__meta",plural(stuN(es),"student")));
    const w=es.filter(e=>!e.done).length;t.appendChild(pill(w?w+" waiting":"All done",w?"strong":""));t.onclick=goSv({lvl:"sections",g});grid.appendChild(t);});
   wrap.appendChild(el("div","sec-head")).append(el("span","muted","Pick a grade level"));wrap.lastChild.remove();wrap.appendChild(grid);if(!grid.children.length)wrap.appendChild(empty(emptyMsg()));}
  else if(sv.lvl==="sections"){wrap.appendChild(crumbs([{t:"Students",fn:goSv({lvl:"grades"})},{t:sv.g}]));const m=byGrade.get(sv.g);
   [...m.keys()].sort((a,b)=>ALLSEC.indexOf(a)-ALLSEC.indexOf(b)).forEach(s=>{const es=m.get(s),r=el("button","row");r.type="button";r.appendChild(el("span","ico",null,IC.people));
    const b=el("span","row__body");b.appendChild(el("div","card__title",s));b.appendChild(el("div","card__meta",plural(stuN(es),"student")));r.appendChild(b);
    const w=es.filter(e=>!e.done).length;if(w)r.appendChild(pill(w+" waiting","strong"));r.insertAdjacentHTML("beforeend",IC.chev);r.onclick=goSv({lvl:"roster",g:sv.g,s});wrap.appendChild(r);});}
  else if(sv.lvl==="roster"){wrap.appendChild(crumbs([{t:"Students",fn:goSv({lvl:"grades"})},{t:sv.g,fn:goSv({lvl:"sections",g:sv.g})},{t:sv.s}]));
   const es=byGrade.get(sv.g).get(sv.s);[...new Set(es.map(e=>e._g))].sort((a,b)=>a.name.localeCompare(b.name)).forEach(g=>wrap.appendChild(studentRow(g,es,false)));}
  else{const st=all.find(e=>e._id===sv.st),g=st._g,mine=g.items.filter(inB).slice().reverse(),s=canon(g.items[0].section);
   wrap.appendChild(crumbs([{t:"Students",fn:goSv({lvl:"grades"})},{t:gradeOf(s),fn:goSv({lvl:"sections",g:gradeOf(s)})},{t:s,fn:goSv({lvl:"roster",g:gradeOf(s),s})},{t:g.name}]));
   const head=el("div","card");head.appendChild(el("span","ico avatar",initials(g.name)));const b=el("div","card__body");b.appendChild(el("div","card__title wrap",g.name));b.appendChild(el("div","card__meta",s));head.appendChild(b);
   head.appendChild(pill(mine.length+(mine.length===1?" loss":" losses"),mine.length>1?"repeat":""));wrap.appendChild(head);
   const ul=el("div","stack");ul.classList.add("sec-head");ul.classList.remove("sec-head");
   mine.forEach(e=>{const c=el("div","card"+(e.exempt?" card--exempt":"")+(e._id===flashId?" card--flash":""));const bb=el("div","card__body");bb.appendChild(el("div","card__title",e.reason||"—"));
    bb.appendChild(el("div","card__meta",[when(e.ts),selN()==="all"?"Batch "+e._b:"",e.exempt?"Exempt":""].filter(Boolean).join(" · ")));c.appendChild(bb);c.appendChild(pill(e.done?"QR made":"Waiting",e.done?"outline":"strong"));
    c.appendChild(ibtn(IC.dots,"Actions for "+e.reason,()=>reqMenu(e)));ul.appendChild(c);});
   const h=el("div","sec-head");h.appendChild(el("h2",null,"Losses"));wrap.appendChild(h);wrap.appendChild(ul);}
  box.appendChild(wrap);}
function renderAdmin(root){
  const wide=tab==="sheet"?" page--wide":"";
  const page=el("div","page stack"+wide);
  const bar=el("header","appbar");bar.appendChild(el("img","logo logo--sm"));bar.firstChild.alt="ASTIG";bar.firstChild.src=LOGO;
  bar.appendChild(el("h1",null,tab==="todo"?"Requests":tab==="sheet"?"Sheet":"Students"));
  bar.appendChild(ibtn(IC.search,"Search",()=>{searchOpen=!searchOpen;render();if(searchOpen){const i=document.getElementById("q");i&&i.focus();}}));
  bar.appendChild(ibtn(IC.dots,"More actions",moreMenu));page.appendChild(bar);
  const main=el("main","stack");
  if(!loaded){for(let i=0;i<4;i++)main.appendChild(el("div","skel"));page.appendChild(main);root.appendChild(page);root.appendChild(tabbar());return;}
  if(tab==="sheet"&&sheetFull){const o=el("div","sheetfull");renderSheet(o);root.appendChild(o);return;}
  const groups=cluster();all.forEach(e=>{e._b=batchOf(e);});const P=all.filter(inB);
  const chip=el("button","chip");chip.type="button";chip.setAttribute("aria-label","Batch: "+bLabel()+". Change batch");chip.appendChild(el("span",null,"Viewing: "+bLabel()));chip.insertAdjacentHTML("beforeend",IC.down);chip.onclick=batchSheet;
  main.appendChild(chip);if(tab!=="sheet")main.appendChild(hero(P));
  if((searchOpen||q)&&tab!=="sheet")main.appendChild(searchBox());
  if(tab==="todo")renderTodo(main,P);else if(tab==="sheet")renderSheet(main);else renderStudents(main,P,groups);
  page.appendChild(main);root.appendChild(page);root.appendChild(tabbar());}
function tabbar(){const n=el("nav","tabbar");n.setAttribute("aria-label","Main");
  [["todo","To do",IC.list],["stu","Students",IC.people],["sheet","Sheet",IC.grid]].forEach(([k,l,ic])=>{const b=el("button");b.type="button";b.appendChild(el("span","ico",null,ic));b.appendChild(el("span",null,l));if(tab===k)b.setAttribute("aria-current","page");
   b.onclick=()=>{tab=k;if(k==="stu")sv={lvl:"grades"};render();window.scrollTo(0,0);};n.appendChild(b);});return n;}

/* ---------- mini spreadsheet, one per batch (same columns as KUWANG_BY_BATCH.xlsx) ---------- */
const COLS=["LRN","First Name","Middle Name","Last Name","Extension","Parent Mobile No","Parent Email","Section"];
function loadRows(n){const d=sheets.find(x=>x.n===n);let r=[];try{r=d?JSON.parse(d.rows):[];}catch(e){}while(r.length<15)r.push(Array(COLS.length).fill(""));return r;}
function saveSheet(manual){clearTimeout(saveT);const n=sheetN,d=sheets.find(x=>x.n===n),rows=JSON.stringify(sheetDraft);
  const p=d?updateDoc(doc(db,"sheets",d._id),{rows}):addDoc(collection(db,"sheets"),{n,rows});
  return p.then(()=>{sheetDirty=false;const s=document.getElementById("saveState");if(s)s.textContent="Saved ✓ "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});if(manual)say("Saved.");})
   .catch(()=>{const s=document.getElementById("saveState");if(s)s.textContent="Not saved. Check your connection.";say("Couldn’t save the sheet.","bad");});}
function touchSheet(){sheetDirty=true;const s=document.getElementById("saveState");if(s)s.textContent="Saving…";clearTimeout(saveT);saveT=setTimeout(()=>saveSheet(false),1200);}
function copySheet(){const rows=sheetDraft.filter(r=>r.some(c=>clean(c)));if(!rows.length)return say("Nothing to copy yet.","bad");
  const text=[COLS].concat(rows).map(r=>r.join("\t")).join("\n");const ok=()=>say("Copied "+rows.length+" rows. Paste into Excel.");
  const fb=()=>{const t=el("textarea");t.value=text;document.body.appendChild(t);t.select();let r=false;try{r=document.execCommand("copy");}catch(x){}document.body.removeChild(t);r?ok():say("Copy failed. Try again.","bad");};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok,fb);else fb();}
function renderSheet(box){const n=selN()==="all"?curN():selN();if(sheetN!==n){sheetN=n;sheetDraft=loadRows(n);sheetDirty=false;}
  if(!sheetFull)box.appendChild(el("p","muted","Batch "+n+" sheet. It saves by itself. You can paste straight from Excel."));
  const bar=el("div","sheetbar");if(sheetFull)bar.appendChild(btn("Exit full screen","btn--secondary",()=>{sheetFull=false;render();}));bar.appendChild(btn("Copy all","",copySheet));bar.appendChild(btn("Save","btn--secondary",()=>saveSheet(true)));
  if(!sheetFull)bar.appendChild(btn("Full screen","btn--secondary",()=>{sheetFull=true;render();}));bar.appendChild(btn("Add 10 rows","btn--text",()=>{for(let i=0;i<10;i++)sheetDraft.push(Array(COLS.length).fill(""));touchSheet();render();}));
  const st=el("div","savestate",sheetFull?"Batch "+n:"");st.id="saveState";bar.appendChild(st);box.appendChild(bar);
  const wrap=el("div","gridwrap");wrap.tabIndex=0;wrap.setAttribute("role","region");wrap.setAttribute("aria-label","Batch "+n+" spreadsheet");
  const t=el("table","grid"),hr=el("tr");hr.appendChild(el("th","rn",""));COLS.forEach(c=>{const th=el("th",null,c);th.scope="col";hr.appendChild(th);});t.appendChild(el("thead")).appendChild(hr);
  const tb=el("tbody");sheetDraft.forEach((row,ri)=>{const tr=el("tr");tr.appendChild(el("td","rn",ri+1));
   COLS.forEach((c,ci)=>{const td=el("td"),i=el("input");i.type="text";i.value=row[ci]||"";i.setAttribute("aria-label",c+", row "+(ri+1));
    i.oninput=()=>{sheetDraft[ri][ci]=i.value;touchSheet();};
    i.onpaste=ev=>{const tx=(ev.clipboardData||window.clipboardData).getData("text");if(tx.indexOf("\t")<0&&tx.indexOf("\n")<0)return;ev.preventDefault();
     tx.replace(/\r/g,"").replace(/\n$/,"").split("\n").forEach((line,dr)=>{while(sheetDraft.length<=ri+dr)sheetDraft.push(Array(COLS.length).fill(""));line.split("\t").forEach((v,dc)=>{if(ci+dc<COLS.length)sheetDraft[ri+dr][ci+dc]=v;});});
     touchSheet();i.blur();render();};
    i.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();const nx=tb.children[ri+1];if(nx)nx.querySelectorAll("input")[ci].focus();}};
    td.appendChild(i);tr.appendChild(td);});tb.appendChild(tr);});
  t.appendChild(tb);wrap.appendChild(t);box.appendChild(wrap);}

/* ---------- public form + sign in ---------- */
function renderPublic(root){const page=el("div","page public");const logo=el("img","logo");logo.alt="ASTIG";logo.src=LOGO;if(!sent)page.appendChild(logo);
  if(sent){page.appendChild(logo);const p=el("p","final","Kuhaa ra sa SSLG office, ");p.appendChild(el("strong",null,"AYAW NA WAD-A PLEASE"));page.appendChild(p);page.appendChild(btn("Send another","btn--secondary btn--full",()=>{sent=false;render();}));root.appendChild(page);return;}
  const box=el("div","card-box");box.appendChild(el("h1",null,"Lost QR"));
  const f=(lab,inp)=>{const l=el("label","field",lab);l.appendChild(inp);box.appendChild(l);return inp;};
  const nm=el("input");nm.type="text";nm.maxLength=100;nm.placeholder="Jesse Harris Almacin";f("Name of student",nm);
  const g=el("select");const gp=el("option","","Select grade level");gp.value="";gp.disabled=true;g.appendChild(gp);GRADES.forEach(([x])=>{const o=el("option",null,x);o.value=x;g.appendChild(o);});g.value="";f("Grade level",g);
  const s=el("select");f("Section",s);const fill=()=>{s.textContent="";const ph=el("option",null,g.value?"Select section":"Select grade level first");ph.value="";ph.disabled=true;s.appendChild(ph);((GRADES.find(x=>x[0]===g.value)||[,[]])[1]).forEach(x=>{const o=el("option",null,x);o.value=x;s.appendChild(o);});s.value="";s.disabled=!g.value;};g.onchange=fill;fill();
  const rs=el("input");rs.type="text";rs.maxLength=100;rs.placeholder="Lost ID";f("Why was it lost?",rs);
  const msg=el("div","msg");msg.setAttribute("role","status");msg.setAttribute("aria-live","polite");
  const send=btn("Send","btn--full",async()=>{const name=clean(nm.value),reason=clean(rs.value);msg.textContent=!name?"Enter the name of the student.":!g.value?"Select the grade level.":!s.value?"Select the section.":!reason?"Enter why it was lost.":"";if(msg.textContent)return;
   send.disabled=true;await addDoc(collection(db,COL),{name,section:s.value,reason,ts:Date.now(),done:false});sent=true;render();});
  send.classList.add("btn--send");box.appendChild(el("div","sec-head")).remove();box.appendChild(send);box.appendChild(msg);page.appendChild(box);root.appendChild(page);}
function renderLogin(root){const page=el("div","page public");const logo=el("img","logo");logo.alt="ASTIG";logo.src=LOGO;page.appendChild(logo);const box=el("div","card-box");box.appendChild(el("h1",null,"Admin sign in"));
  const f=(lab,t)=>{const l=el("label","field",lab);const i=el("input");i.type=t;l.appendChild(i);box.appendChild(l);return i;};const em=f("Email","email"),pw=f("Password","password");em.autocomplete="username";pw.autocomplete="current-password";
  const msg=el("div","msg");msg.setAttribute("role","status");msg.setAttribute("aria-live","polite");
  const go=()=>{const e=clean(em.value);if(!e||!pw.value){msg.textContent="Enter your email and password.";return;}msg.textContent="";signInWithEmailAndPassword(auth,e,pw.value).catch(()=>{msg.textContent="Wrong email or password.";});};
  pw.onkeydown=ev=>{if(ev.key==="Enter")go();};
  box.appendChild(btn("Sign in","btn--full",go));box.appendChild(msg);page.appendChild(box);root.appendChild(page);}

/* ---------- routing + data ---------- */
function startList(){if(unsub)return;
  unsub=onSnapshot(collection(db,COL),snap=>{all=snap.docs.map(d=>({...d.data(),_id:d.id})).sort((a,b)=>(a.ts||0)-(b.ts||0));loaded=true;render();},()=>say("Couldn’t load requests.","bad"));
  onSnapshot(collection(db,"sheets"),snap=>{sheets=snap.docs.map(d=>({...d.data(),_id:d.id}));if(!sheetDirty)sheetN=null;render();},()=>say("Sheets need a Firebase rule for “sheets”.","bad"));
  unsubB=onSnapshot(collection(db,"batches"),snap=>{batches=snap.docs.map(d=>({...d.data(),_id:d.id})).filter(b=>Number.isFinite(b.ts)&&Number.isFinite(b.n)).sort((a,b)=>a.ts-b.ts);render();},()=>say("Batches need a Firebase rule for “batches”.","bad"));}
function render(){const ae=document.activeElement;if(loaded&&ae&&ae.closest&&ae.closest(".grid"))return;const keep=document.activeElement&&document.activeElement.id==="q";const root=document.getElementById("app");root.textContent="";
  if(location.hash!=="#list")return renderPublic(root);
  if(!user)return renderLogin(root);startList();renderAdmin(root);}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&sheetFull&&!document.querySelector(".sheet")){sheetFull=false;render();}});
window.addEventListener("hashchange",render);
onAuthStateChanged(auth,u=>{user=u;if(!u){unsub=unsubB=null;all=[];batches=[];loaded=false;}render();});
const LOGO="astig.png";
render();
</script>
